name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: templates/node-claude-quickstart/package-lock.json

      - name: Validate internal links
        run: python .github/scripts/check_internal_links.py

      - name: Test Python example
        working-directory: templates/python-agent-boilerplate
        run: |
          python -m py_compile main.py
          python -m unittest
          python main.py

      - name: Validate Node example
        working-directory: templates/node-claude-quickstart
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check index.mjs
