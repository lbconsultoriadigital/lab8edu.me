name: Relatar um bug
description: Registre um erro reproduzível em código, documentação ou automação.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Problemas de segurança devem seguir SECURITY.md e não podem ser publicados aqui.
  - type: input
    id: location
    attributes:
      label: Receita, arquivo ou página
      placeholder: "Ex.: templates/python-agent-boilerplate/main.py"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtido
      description: Remova tokens, chaves, dados pessoais e caminhos privados.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Execute...
        2. Informe...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Sistema operacional, versão do Python ou Node.js e ferramenta de IA, quando aplicável.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Confirmei que não há credenciais ou dados pessoais no relato.
          required: true
        - label: Procurei issues existentes sobre o mesmo problema.
          required: true
