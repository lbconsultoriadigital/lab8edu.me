name: Propor uma receita
description: Sugira um prompt, agente, automação, template ou guia reproduzível.
title: "[Receita]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por contribuir. Não inclua credenciais, dados pessoais ou material sem licença.
  - type: input
    id: problem
    attributes:
      label: Problema
      description: Qual problema específico a receita resolve?
      placeholder: "Ex.: estruturar uma pesquisa com fontes verificáveis"
    validations:
      required: true
  - type: input
    id: result
    attributes:
      label: Resultado esperado
      description: O que a pessoa consegue observar ou produzir ao final?
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Formato
      options:
        - Prompt ou skill
        - Agente ou automação
        - Template de código
        - MCP ou integração
        - Guia ou explicação
        - Outro
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Público e contexto
      description: Para quem é, qual o nível e quando deve ser usada?
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requisitos, custos e compatibilidade
      description: Informe ferramentas, versões, contas, APIs e possíveis cobranças.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência de teste
      description: Explique como você testou e qual saída obteve, sem dados sensíveis.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitações e segurança
      description: O que pode falhar e quais cuidados são necessários?
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Confirmações
      options:
        - label: Li o padrão de receitas e posso licenciar minha contribuição sob MIT.
          required: true
        - label: Removi credenciais, dados pessoais e materiais sem autorização.
          required: true
