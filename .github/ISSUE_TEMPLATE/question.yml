name: Dúvida de uso
description: Peça ajuda para reproduzir ou adaptar uma receita.
title: "[Dúvida]: "
body:
  - type: input
    id: recipe
    attributes:
      label: Receita ou arquivo relacionado
      placeholder: "Ex.: templates/node-claude-quickstart"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: O que você está tentando fazer?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: O que você já tentou?
      description: Inclua comandos e mensagens de erro sem credenciais ou dados pessoais.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Sistema, versões e ferramenta usada.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi chaves, tokens e dados pessoais antes de enviar.
          required: true
