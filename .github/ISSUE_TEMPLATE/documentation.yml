name: Melhorar a documentação
description: Corrija uma explicação, link, tradução ou problema de acessibilidade.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Onde está o problema?
      placeholder: "Cole a URL ou o caminho do arquivo"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: O que está confuso ou incorreto?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Mudança sugerida
      description: Se possível, proponha uma redação ou estrutura melhor.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impacto principal
      options:
        - Clareza para iniciantes
        - Correção técnica
        - Link ou navegação
        - Acessibilidade
        - Tradução
        - Outro
    validations:
      required: true
